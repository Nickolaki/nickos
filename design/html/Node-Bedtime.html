<!doctype html>
<html lang="en">
<head>

<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;color:#EEF1F6;background:#0B0E13;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;margin:0}
input{font:inherit;color:inherit}
.disp{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-0.01em}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#A0A8B6}
.muted{color:#A0A8B6}
.btn{height:60px;padding:0 28px;border-radius:18px;background:#1E2430;font-weight:700;font-size:19px;display:inline-flex;align-items:center;justify-content:center;gap:12px;box-sizing:border-box;white-space:nowrap}
.btn.primary{background:#FFB547;color:#1C1305}
.btn.ghost{background:transparent;border:2px solid #2A3140}
.btn.danger{background:transparent;border:2px solid #4A2A2A;color:#FF8A7A}
.btn.big{height:72px;font-size:21px;padding:0 36px;border-radius:22px}
.iconbtn{width:60px;height:60px;border-radius:50%;background:#1E2430;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tab{height:56px;padding:0 18px;border-radius:15px;display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:#A0A8B6}
.tab.on{background:#FFB547;color:#1C1305}
.field{height:68px;border-radius:18px;background:#1E2430;border:2px solid #2A3140;padding:0 22px;font-size:21px;box-sizing:border-box;width:100%;outline:none}
.field:focus{border-color:#FFB547}
.lbl{font-size:15px;font-weight:700;color:#A0A8B6;display:block;margin-bottom:10px}
input[type=range].rng{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:7px;background:#2A3140;outline:none;margin:0;cursor:pointer}
input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;background:#FFFFFF;box-shadow:0 2px 10px rgba(0,0,0,.45)}
input[type=range].rng::-moz-range-thumb{width:38px;height:38px;border:0;border-radius:50%;background:#FFFFFF}
.sw{position:relative;display:inline-block;width:60px;height:34px;flex-shrink:0}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:17px;background:#2A3140;pointer-events:none}
.sw span::after{content:"";position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:50%;background:#C5CBD6}
.sw input:checked+span{background:#FFB547}
.sw input:checked+span::after{left:30px;background:#1C1305}
.key{height:84px;border-radius:22px;background:#1E2430;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center}
.chip{height:44px;padding:0 18px;border-radius:22px;background:#1E2430;display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:16px;white-space:nowrap}
</style>

<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #121433; position: relative; overflow: hidden; display: flex; flex-direction: column">

<div style="height: 112px; padding: 0 40px; display: flex; align-items: center; gap: 20px; flex-shrink: 0">
<div style="width: 68px; height: 68px; border-radius: 50%; background: #FF7A59; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="disp" style="font-size: 31px; font-weight: 800; color: #10131F; line-height: 1">H</span></div>
<div class="disp" style="font-size: 40px; font-weight: 800">Hi Hailey</div>
<div style="flex-grow: 1"></div>
<div class="chip" style="height: 44px; background: rgba(255,255,255,.08)"><span style="width: 10px; height: 10px; border-radius: 50%; background: #3DDC84; flex-shrink: 0; display: inline-block"></span> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg> Linked to Dad&#39;s tablet</div>
<div style="display: flex; align-items: center; gap: 8px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="2.5" y="7" width="17" height="10" rx="2.5"/><path d="M22 10.5v3"/><rect x="5" y="9.5" width="10" height="5" rx="1" fill="currentColor" stroke="none"/></svg><span class="disp" style="font-size: 30px; font-weight: 800">82%</span></div>
<div class="disp" style="font-size: 48px; font-weight: 800">4:27</div>
</div>
<div style="flex-grow: 1; padding: 4px 40px 40px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 24px">
<button style="border-radius: 36px; background: #1D2150; padding: 28px; display: flex; flex-direction: column; gap: 22px; text-align: left; box-sizing: border-box; overflow: hidden; grid-column: span 2; grid-row: span 2">
<div style="display: flex; gap: 16px"><div role="img" aria-label="Star Harbour artwork" style="width: 150px; height: 225px; flex-shrink: 0; border-radius: 16px; position: relative; overflow: hidden; background: linear-gradient(165deg, #12305C 0%, #E86F4A 100%); box-shadow: 0 12px 30px rgba(0,0,0,.35)"><div style="position: absolute; width: 78px; height: 78px; border-radius: 50%; background: #FFD27A; left: 54px; top: 27px; opacity: 0.92"></div><div style="position: absolute; left: -15%; width: 130%; bottom: -67px; height: 139px; border-radius: 50%; background: #12305C; opacity: 0.88"></div><div class="disp" style="position: absolute; left: 10px; right: 10px; bottom: 10px; font-size: 22px; line-height: 0.95; font-weight: 800; color: #FFFFFF; text-shadow: 0 2px 14px rgba(0,0,0,.45)">Star Harbour</div></div><div role="img" aria-label="Captain Comet artwork" style="width: 150px; height: 225px; flex-shrink: 0; border-radius: 16px; position: relative; overflow: hidden; background: linear-gradient(165deg, #402A5E 0%, #FF9F68 100%); box-shadow: 0 12px 30px rgba(0,0,0,.35)"><div style="position: absolute; width: 78px; height: 78px; border-radius: 50%; background: #FFE08A; left: 54px; top: 27px; opacity: 0.92"></div><div style="position: absolute; left: -15%; width: 130%; bottom: -67px; height: 139px; border-radius: 50%; background: #402A5E; opacity: 0.88"></div><div class="disp" style="position: absolute; left: 10px; right: 10px; bottom: 10px; font-size: 22px; line-height: 0.95; font-weight: 800; color: #FFFFFF; text-shadow: 0 2px 14px rgba(0,0,0,.45)">Captain Comet</div></div><div role="img" aria-label="Moss &amp; Pebble artwork" style="width: 150px; height: 225px; flex-shrink: 0; border-radius: 16px; position: relative; overflow: hidden; background: linear-gradient(165deg, #1D4B3A 0%, #8BC34A 100%); box-shadow: 0 12px 30px rgba(0,0,0,.35)"><div style="position: absolute; width: 78px; height: 78px; border-radius: 50%; background: #F7F3C6; left: 54px; top: 27px; opacity: 0.92"></div><div style="position: absolute; left: -15%; width: 130%; bottom: -67px; height: 139px; border-radius: 50%; background: #1D4B3A; opacity: 0.88"></div><div class="disp" style="position: absolute; left: 10px; right: 10px; bottom: 10px; font-size: 22px; line-height: 0.95; font-weight: 800; color: #FFFFFF; text-shadow: 0 2px 14px rgba(0,0,0,.45)">Moss &amp; Pebble</div></div></div>
<div style="flex-grow: 1"></div>
<div style="display: flex; align-items: center; gap: 18px; width: 100%">
<div style="width: 76px; height: 76px; border-radius: 21px; background: #FFB547; color: #10131F; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3.5l9 15.5H3z"/><path d="M10.5 11v5l4.2-2.5z" fill="currentColor" stroke="none"/></svg></div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="disp" style="font-size: 40px; font-weight: 800">Jellyfin</span><span style="font-size: 19px; color: #C9CCF0; font-weight: 600">Keep watching Star Harbour</span></div>
<span style="width: 72px; height: 72px; border-radius: 50%; background: #FFB547; color: #1C1305; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/></svg></span>
</div></button>
<button style="border-radius: 36px; background: #2EC4B6; color: #10131F; padding: 26px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; box-sizing: border-box">
<div style="width: 88px; height: 88px; border-radius: 26px; background: rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center"><svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M18 3l3 3-9 9-3-3z"/><path d="M9 12c-3 0-4 2-4 4 0 1.5-1 2-2 2 1.5 1.5 3.5 2 5 2 3 0 4-2 4-4"/></svg></div>
<span class="disp" style="font-size: 36px; font-weight: 800">Drawing</span></button><button style="border-radius: 36px; background: #FFB547; color: #10131F; padding: 26px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; box-sizing: border-box">
<div style="width: 88px; height: 88px; border-radius: 26px; background: rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center"><svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M8 7h7"/></svg></div>
<span class="disp" style="font-size: 36px; font-weight: 800">Reader</span></button><button style="border-radius: 36px; background: #B89CFF; color: #10131F; padding: 26px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; box-sizing: border-box">
<div style="width: 88px; height: 88px; border-radius: 26px; background: rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center"><svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 8h3.5a2 2 0 1 1 4 0H16v3.5a2 2 0 1 1 0 4V19H5z"/></svg></div>
<span class="disp" style="font-size: 36px; font-weight: 800">Puzzles</span></button><button style="border-radius: 36px; background: #6FB8FF; color: #10131F; padding: 26px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; box-sizing: border-box">
<div style="width: 88px; height: 88px; border-radius: 26px; background: rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center"><svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></div>
<span class="disp" style="font-size: 36px; font-weight: 800">Music</span></button>
</div>
<div style="position: absolute; left: 50%; top: 28px; transform: translateX(-50%); width: 640px; border-radius: 32px; background: #FFF4E0; color: #1C1305; padding: 22px 26px; display: flex; align-items: center; gap: 22px; box-shadow: 0 24px 60px rgba(0,0,0,.5); box-sizing: border-box" role="status">
<div style="width: 76px; height: 76px; border-radius: 50%; background: #FFB547; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px"><div class="disp" style="font-size: 32px; font-weight: 800; line-height: 1.05">Bedtime in 5 minutes</div><div style="font-size: 19px; font-weight: 600; color: #5A4520">Find a good spot to stop.</div></div>
<div class="disp" style="font-size: 36px; font-weight: 800; font-variant-numeric: tabular-nums">5:00</div>
</div>
</div>


</body>
</html>
