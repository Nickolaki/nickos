.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:17px;background:#2A3140;pointer-events:none}
.sw span::after{content:"";position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:50%;background:#C5CBD6}
.sw input:checked+span{background:#FFB547}
.sw input:checked+span::after{left:30px;background:#1C1305}
