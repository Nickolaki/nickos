<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;color:#EEF1F6;background:#0B0E13;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;margin:0}
input{font:inherit;color:inherit}
.disp{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-0.01em}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#A0A8B6}
.muted{color:#A0A8B6}
.btn{height:60px;padding:0 28px;border-radius:18px;background:#1E2430;font-weight:700;font-size:19px;display:inline-flex;align-items:center;justify-content:center;gap:12px;box-sizing:border-box;white-space:nowrap}
.btn.primary{background:#FFB547;color:#1C1305}
.btn.ghost{background:transparent;border:2px solid #2A3140}
.btn.danger{background:transparent;border:2px solid #4A2A2A;color:#FF8A7A}
.btn.big{height:72px;font-size:21px;padding:0 36px;border-radius:22px}
.iconbtn{width:60px;height:60px;border-radius:50%;background:#1E2430;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tab{height:56px;padding:0 18px;border-radius:15px;display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:#A0A8B6}
.tab.on{background:#FFB547;color:#1C1305}
.field{height:68px;border-radius:18px;background:#1E2430;border:2px solid #2A3140;padding:0 22px;font-size:21px;box-sizing:border-box;width:100%;outline:none}
.field:focus{border-color:#FFB547}
.lbl{font-size:15px;font-weight:700;color:#A0A8B6;display:block;margin-bottom:10px}
input[type=range].rng{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:7px;background:#2A3140;outline:none;margin:0;cursor:pointer}
input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;background:#FFFFFF;box-shadow:0 2px 10px rgba(0,0,0,.45)}
input[type=range].rng::-moz-range-thumb{width:38px;height:38px;border:0;border-radius:50%;background:#FFFFFF}
.sw{position:relative;display:inline-block;width:60px;height:34px;flex-shrink:0}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:17px;background:#2A3140;pointer-events:none}
.sw span::after{content:"";position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:50%;background:#C5CBD6}
.sw input:checked+span{background:#FFB547}
.sw input:checked+span::after{left:30px;background:#1C1305}
.key{height:84px;border-radius:22px;background:#1E2430;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center}
.chip{height:44px;padding:0 18px;border-radius:22px;background:#1E2430;display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:16px;white-space:nowrap}
</style>

<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #0B0E13; position: relative; overflow: hidden; display: flex; flex-direction: column">

<div style="height: 104px; padding: 0 32px; display: flex; align-items: center; gap: 24px; border-bottom: 1px solid #1E2430; flex-shrink: 0; position: relative; z-index: 2; background: #0B0E13">

<div style="border-radius: 28px; background: #151A22; padding: 24px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box; ">
<div style="display: flex; align-items: center; gap: 12px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M18.2 11v2"/></svg><span style="font-size: 20px; font-weight: 800">Screen</span></div><div style="display: flex; gap: 6px; background: #1E2430; padding: 6px; border-radius: 22px"><button style="flex: 1 1 0; height: 68px; border-radius: 17px; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; color: #A0A8B6"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M4 3l16 18"/></svg> Off</button><button style="flex: 1 1 0; height: 68px; border-radius: 17px; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; background: #FFB547; color: #1C1305"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg> On</button></div><button class="btn big" style="width: 100%"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg> Lock tablet now</button></div>
<div style="border-radius: 28px; background: #151A22; padding: 24px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box; ">
<div style="display: flex; align-items: center; gap: 12px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span style="font-size: 20px; font-weight: 800">Bedtime</span></div><div style="display: flex; gap: 8px"><button class="chip" style="height: 56px; flex: 1 1 0; justify-content: center; font-size: 18px; ">15m</button><button class="chip" style="height: 56px; flex: 1 1 0; justify-content: center; font-size: 18px; background: #FFB547; color: #1C1305">30m</button><button class="chip" style="height: 56px; flex: 1 1 0; justify-content: center; font-size: 18px; ">45m</button><button class="chip" style="height: 56px; flex: 1 1 0; justify-content: center; font-size: 18px; ">60m</button></div><div style="border-radius: 18px; background: #1E2430; padding: 14px 18px; display: flex; align-items: center; gap: 14px"><div style="flex-grow: 1"><div class="muted" style="font-size: 14px; font-weight: 700">SCREEN TURNS OFF IN</div><div class="disp" style="font-size: 34px; font-weight: 800">28 min</div></div><button class="btn ghost" style="height: 52px">Cancel</button></div></div>
<div style="border-radius: 28px; background: #151A22; padding: 24px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box; ">
<div style="display: flex; align-items: center; gap: 12px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="2.5" y="7" width="17" height="10" rx="2.5"/><path d="M22 10.5v3"/><rect x="5" y="9.5" width="10" height="5" rx="1" fill="currentColor" stroke="none"/></svg><span style="font-size: 20px; font-weight: 800">Battery</span></div><div class="disp" style="font-size: 88px; font-weight: 800; line-height: 1">82%</div><div style="height: 14px; border-radius: 14px; background: rgba(255,255,255,.14); overflow: hidden"><div style="width: 82%; height: 100%; background: #3DDC84; border-radius: 14px"></div></div><div class="muted" style="font-size: 17px; font-weight: 600">Not charging</div></div>
<div style="border-radius: 28px; background: #151A22; padding: 24px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box; ">

<div style="border-radius: 28px; background: #151A22; padding: 24px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box; ">
<div style="display: flex; align-items: center; gap: 12px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span style="font-size: 20px; font-weight: 800">Brightness</span></div><div class="disp" style="font-size: 56px; font-weight: 800; line-height: 1">75%</div><div style="padding: 12px 0"><input class="rng" type="range" min="0" max="100" value="75" aria-label="Brightness" style="background: linear-gradient(90deg, #FFB547 75%, #2A3140 75%)"></div></div>
